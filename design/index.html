  <style>
    .butler-config-card{border-color:#c9dcf5;box-shadow:0 5px 18px rgba(25,90,160,.06)}
    .butler-manager-grid{align-items:stretch;margin-bottom:18px}

<body>
  <div class="shell" id="shell">
    <aside class="sidebar" aria-label="AgentDock 主导航">
      <div class="brand"><div class="brand-mark">A</div><div class="brand-copy"><div class="brand-name">AgentDock</div><div class="brand-sub">LOCAL AI WORKSPACE</div></div></div>
      <div class="server-chip"><i class="online-dot"></i><span>本地 AI Core · 已连接</span></div>
      <nav class="nav-scroll" id="sideNav"></nav>
      <div class="sidebar-footer">
        <button class="footer-button" data-action="language-menu"><span class="nav-icon">文</span><span id="languageLabel">中文</span></button>
        <button class="footer-button" data-action="toggle-theme"><span class="nav-icon" id="themeGlyph">◐</span><span id="themeLabel">外观：跟随系统</span></button>
        <button class="footer-button" data-action="toggle-sidebar"><span class="nav-icon">‹</span><span>收起侧栏</span></button>
        <div class="user-mini"><div class="avatar">林</div><div class="user-copy"><div class="user-name">本地用户</div><div class="user-sub">AgentDock 管理员</div></div></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="top-left"><button class="icon-button mobile-menu" aria-label="打开导航" data-action="open-mobile-menu">☰</button><div class="crumb">AgentDock <span class="muted">/</span> <strong id="currentTitle">概览</strong></div></div>
        <div class="top-actions">
          <button class="global-search" data-action="open-search" aria-label="搜索"><span>⌕</span><span class="search-copy">搜索页面、工作区、技能…</span><span class="kbd">⌘ K</span></button>
          <button class="icon-button" aria-label="通知" data-action="notifications">♧</button>
