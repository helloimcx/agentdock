[server]
host = "0.0.0.0"
port = 8080
log_level = "INFO"
api_key = "agentdock-local"
max_sandbox_timeout_seconds = 86400

[runtime]
type = "docker"
execd_image = "opensandbox/execd:v1.0.7"

[storage]
allowed_host_paths = []

[docker]
network_mode = "bridge"
host_ip = "127.0.0.1"
drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
no_new_privileges = true
apparmor_profile = ""
pids_limit = 512
seccomp_profile = ""

[ingress]
mode = "direct"
