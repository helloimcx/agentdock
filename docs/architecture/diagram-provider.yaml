schema_version: 1
provider:
  preferred: archify
  active: archify
  fallback: mermaid
capabilities:
  validate: required
  render_readme: required
  compare: preferred
outputs:
  readme: docs/architecture/system-architecture.light.png
  readme_dark: docs/architecture/system-architecture.dark.png
